<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DoitDelivery Video Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<style>
/* ── Design tokens — matches DoitDelivery docs theme ── */
:root {
  --navy:      #051F4E;
  --navy-mid:  #0a2d6e;
  --navy-soft: #0d3580;
  --green:     #2ECC71;
  --green-dim: #27ae60;
  --sidebar-bg: #051F4E;
  --content-bg: #f7f8fc;
  --surface:    #ffffff;
  --border:     #dde3f0;
  --fg:         #0f1b34;
  --fg2:        #334575;
  --fg3:        #6b7fa8;
  --accent:     #2ECC71;
  --accent-text:#059048;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--content-bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

/* ── Top nav bar ── */
.topbar {
  background: var(--navy);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 24px;
  height: 52px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08);
}

.topbar-logo {
  text-decoration: none;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.topbar-logo img { height: 22px; width: auto; display: block; }

.topbar-title {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.55);
  margin-left: 4px;
}
.topbar-title::before { content: '/'; margin-right: 8px; opacity: 0.4; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.topbar-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 100px; background: rgba(46,204,113,0.15); color: var(--green); }
.topbar-badge.loading { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
.topbar-badge.error   { background: rgba(231,76,60,0.2); color: #e74c3c; }

/* ── Layout ── */
.layout { display: flex; flex: 1; min-height: 0; }

/* ── Sidebar ── */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--navy);
  color: rgba(255,255,255,0.8);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
}

.sidebar-section { padding: 20px 16px 8px; }
.sidebar-section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
  margin-bottom: 6px;
  padding-left: 8px;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
  line-height: 1.3;
  margin-top: 4px;
}
.sidebar-link:hover { background: rgba(255,255,255,0.07); color: #fff; }
.sl-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; }
.sl-done { margin-left: auto; font-size: 10px; color: var(--green); flex-shrink: 0; }
.sl-arrow { font-size: 9px; opacity: 0.4; transition: transform 0.15s; flex-shrink: 0; }
.sl-arrow.open { transform: rotate(90deg); }
.sl-vids { display: none; padding-left: 13px; margin-bottom: 2px; }
.sl-vids.open { display: block; }
.sl-vid {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 400;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.12s, color 0.12s;
  line-height: 1.35;
}
.sl-vid:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9); }
.sl-vid.done { color: rgba(46,204,113,0.65); }
.sl-vid-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
.sl-vid.done .sl-vid-dot { background: var(--green); }

.sidebar-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 8px 16px; }

.sidebar-filter {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.07);
  margin-top: auto;
}
.sidebar-filter-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.35); margin-bottom: 8px; }
.filter-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.filter-pill {
  font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
  cursor: pointer; transition: all 0.15s; background: none;
}
.filter-pill:hover { border-color: var(--green); color: #fff; }
.filter-pill.active { background: var(--green); border-color: var(--green); color: var(--navy); font-weight: 700; }

/* ── Main content ── */
.content {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 32px 32px 80px;
}

/* ── Page header ── */
.page-header {
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: flex-end;
  gap: 24px;
  flex-wrap: wrap;
}
.page-header-left { flex: 1; min-width: 200px; }
.page-header-left h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.page-header-left p { font-size: 13px; color: var(--fg3); }
.header-stats { display: flex; gap: 20px; flex-wrap: wrap; flex-shrink: 0; }
.hstat { text-align: center; }
.hstat-num { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.1; }
.hstat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg3); }

.progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 12px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--navy), var(--green)); border-radius: 2px; transition: width 0.4s ease; }

/* ── Section ── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--navy);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f7f8fc;
}
.section-count { font-size: 11px; font-weight: 500; color: var(--fg3); background: var(--border); padding: 2px 8px; border-radius: 100px; margin-left: auto; }

/* ── Cards ── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 14px 16px; }
.walkthroughs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 14px 16px; }

/* Card thumbnail */
.card-thumb {
  width: 100%;
  overflow: hidden;
  flex-shrink: 0;
  display: block;
  background: #051F4E;
}

/* Regular card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  color: inherit;
}
.card:hover { border-color: #b8c5de; box-shadow: 0 2px 8px rgba(5,31,78,0.06); }
.card.published { border-left: 3px solid var(--green); }
.card.done { background: #f6fef8; border-color: #c3e6cb; }
.card.done .card-title { color: var(--fg3); }

.card-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.card-check {
  width: 18px; height: 18px; border: 1.5px solid #c8d5e8; border-radius: 4px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.card.done .card-check { background: var(--green); border-color: var(--green-dim); }
.card.done .card-check::after {
  content: ''; width: 10px; height: 6px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}
.card-body { flex: 1; min-width: 0; }
.card-title { font-weight: 500; font-size: 13.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.duration { font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; }

/* Walkthrough card */
.wcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  color: inherit;
}
.wcard:hover { border-color: #b8c5de; box-shadow: 0 2px 12px rgba(5,31,78,0.08); }
.wcard.published { border-top: 3px solid var(--green); }
.wcard.done { background: #f6fef8; border-color: #c3e6cb; }
.wcard-row { display: flex; gap: 12px; align-items: flex-start; padding: 16px; }
.wcard-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.wcard-body { flex: 1; min-width: 0; }
.wcard-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 4px; line-height: 1.3; }
.wcard.done .wcard-title { color: var(--fg3); }
.wcard-desc { font-size: 12px; color: var(--fg3); line-height: 1.5; }
.wcard-badges { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.wcard-check {
  width: 20px; height: 20px; border: 1.5px solid #c8d5e8; border-radius: 5px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s; margin-top: 2px;
}
.wcard.done .wcard-check { background: var(--green); border-color: var(--green-dim); }
.wcard.done .wcard-check::after {
  content: ''; width: 10px; height: 6px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

/* Pills */
.pill { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 100px; }
.pill-lab-client   { background: #ede9fe; color: #5b21b6; }
.pill-lab-company  { background: #e0f2fe; color: #0369a1; }
.pill-pharmacy     { background: #fef3c7; color: #92400e; }
.pill-driver       { background: #dcfce7; color: #15803d; }
.pill-all          { background: #f1f5f9; color: #475569; }
.status-pill { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 100px; }
.status-published { background: #dcfce7; color: #15803d; }
.status-planned   { background: #f1f5f9; color: #64748b; }
.type-pill { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 100px; flex-shrink: 0; }
.type-walkthrough { background: #eff6ff; color: #1d4ed8; }
.type-feature     { background: #f5f3ff; color: #6d28d9; }

/* Loading / empty states */
.loading-msg { color: var(--fg3); padding: 48px; text-align: center; font-size: 13px; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #dde3f0; border-top-color: var(--navy); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 760px) {
  .sidebar { display: none; }
  .content { padding: 20px 16px 60px; }
  .walkthroughs-grid { grid-template-columns: 1fr; }
  .card-title { white-space: normal; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
}
</style>
</head>
<body>

<!-- ── Top bar ── -->
<nav class="topbar">
  <a class="topbar-logo" href="https://docs.doitdelivery.com"><img src="https://cdn.doitdelivery.com/logo-dark.png" alt="DoitDelivery"></a>
  <span class="topbar-title">Video Library</span>
  <div class="topbar-right">
    <span class="topbar-badge loading" id="api-badge">Loading…</span>
    <button id="logout-btn" hidden style="font-size:11px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);padding:3px 10px;border-radius:6px;cursor:pointer;font-family:inherit;">Sign out</button>
  </div>
</nav>

<!-- ── Login overlay ── -->
<div id="login-overlay" style="display:none;position:fixed;inset:0;background:rgba(5,20,50,0.85);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
  <div style="background:#fff;border-radius:14px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,0.3);">
    <div style="font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:#051F4E;margin-bottom:4px;">Doit<span style="color:#2ECC71">Delivery</span></div>
    <div style="font-size:13px;color:#6b7fa8;margin-bottom:24px;">Sign in to access the video catalog</div>
    <div style="margin-bottom:14px;">
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:#6b7fa8;display:block;margin-bottom:5px;">Email</label>
      <input id="login-email" type="email" autocomplete="email" style="width:100%;border:1px solid #dde3f0;border-radius:7px;padding:9px 12px;font-size:14px;font-family:inherit;color:#0f1b34;outline:none;" placeholder="you@example.com">
    </div>
    <div style="margin-bottom:20px;">
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:#6b7fa8;display:block;margin-bottom:5px;">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" style="width:100%;border:1px solid #dde3f0;border-radius:7px;padding:9px 12px;font-size:14px;font-family:inherit;color:#0f1b34;outline:none;" placeholder="••••••••">
    </div>
    <button id="login-btn" style="width:100%;background:#2ECC71;color:#051F4E;border:none;border-radius:8px;padding:11px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;cursor:pointer;">Sign In</button>
    <div id="login-error" style="font-size:12px;color:#dc2626;margin-top:10px;min-height:16px;text-align:center;"></div>
  </div>
</div>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-label">Sections</div>
      <!-- populated by JS -->
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-filter">
      <div class="sidebar-filter-label">Filter by role</div>
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="lab-client">Lab Client</button>
        <button class="filter-pill" data-filter="lab-company">Lab Co</button>
        <button class="filter-pill" data-filter="pharmacy">Pharmacy</button>
        <button class="filter-pill" data-filter="driver">Driver</button>
        <button class="filter-pill" data-filter="published">Published</button>
      </div>
    </div>
  </aside>

  <!-- ── Content ── -->
  <main class="content" id="content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Video Library</h1>
        <p>Tutorial and feature overview videos for every DoitDelivery user role.</p>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
      <div class="header-stats">
        <div class="hstat"><div class="hstat-num" id="done-count">0</div><div class="hstat-label">Done</div></div>
        <div class="hstat"><div class="hstat-num" id="total-count">42</div><div class="hstat-label">Total</div></div>
        <div class="hstat"><div class="hstat-num">~65 min</div><div class="hstat-label">Runtime</div></div>
      </div>
    </div>
    <div id="catalog"><div class="loading-msg"><span class="spinner"></span> Loading catalog…</div></div>
  </main>

</div>

<script>
(async function () {
  const API_BASE = 'https://api.doitdelivery.com/api';
  const CATALOG_URL = 'videos.json';

  // ── Auth ───────────────────────────────────────────────────────
  let token = null;
  try { token = localStorage.getItem('doit_video_token'); } catch {}

  const overlay    = document.getElementById('login-overlay');
  const loginBtn   = document.getElementById('login-btn');
  const logoutBtn  = document.getElementById('logout-btn');
  const loginError = document.getElementById('login-error');

  function getToken() {
    if (token) return token;
    try { token = localStorage.getItem('doit_video_token'); } catch {}
    return token || null;
  }

  function authHeaders() {
    const t = getToken();
    return t ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t }
             : { 'Content-Type': 'application/json' };
  }

  function showLogin() {
    overlay.style.display = 'flex';
    logoutBtn.hidden = true;
  }
  function hideLogin() {
    overlay.style.display = 'none';
    logoutBtn.hidden = false;
  }

  loginBtn.addEventListener('click', async () => {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    loginError.textContent = '';
    loginBtn.textContent = 'Signing in…';
    loginBtn.disabled = true;
    try {
      const res = await fetch(API_BASE + '/access_tokens', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { email, password } }),
      });
      const j = await res.json();
      if (!res.ok) throw new Error((j.data && j.data.error) || j.error || j.message || 'Invalid credentials');
      // try every plausible location the API might return the token
      token = j.access_token || j.token
           || (j.data && (j.data.access_token || j.data.token))
           || null;
      if (!token) throw new Error('Token not found. Response keys: ' + Object.keys(j).join(', '));
      try { localStorage.setItem('doit_video_token', token); } catch {}
      hideLogin();
      initApp();
    } catch (e) {
      loginError.textContent = e.message || 'Sign in failed';
    } finally {
      loginBtn.textContent = 'Sign In';
      loginBtn.disabled = false;
    }
  });

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') loginBtn.click();
  });

  logoutBtn.addEventListener('click', () => {
    token = null;
    try { localStorage.removeItem('doit_video_token'); } catch {}
    showLogin();
  });

  if (!token) { showLogin(); return; }
  hideLogin();
  initApp();

  async function initApp() {

  const ROLE_CONFIG = {
    'lab-client':  { color: '#8B5CF6', label: 'Lab Client',     icon: '🧪' },
    'lab-company': { color: '#06B6D4', label: 'Lab Company',    icon: '🏢' },
    'pharmacy':    { color: '#F59E0B', label: 'Pharmacy Admin', icon: '💊' },
    'driver':      { color: '#10B981', label: 'Driver App',     icon: '🚗' },
    'all':         { color: '#4F8EF7', label: 'All Roles',      icon: '🌐' },
  };

  // ── Canvas thumbnail helpers (shared with video.html) ───────────
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
  function wrapText(ctx, text, maxWidth) {
    const words = text.split(' '), lines = [];
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current) { lines.push(current); current = word; }
      else { current = test; }
    }
    if (current) lines.push(current);
    return lines;
  }
  function drawThumbnail(canvas, video) {
    const ctx = canvas.getContext('2d');
    const W = 1280, H = 720;
    canvas.width = W; canvas.height = H;
    const primaryRole = video.roles && video.roles[0];
    const rc = ROLE_CONFIG[primaryRole] || ROLE_CONFIG['all'];
    const accentColor = rc.color, roleLabel = rc.label, roleIcon = rc.icon;
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#051F4E'); bgGrad.addColorStop(1, '#031440');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let x = 30; x < W; x += 44) for (let y = 30; y < H; y += 44) { ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill(); }
    const glow = ctx.createRadialGradient(W * 0.85, H * 0.5, 0, W * 0.85, H * 0.5, W * 0.55);
    glow.addColorStop(0, accentColor + '28'); glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2ECC71'; ctx.fillRect(0, 0, W, 5);
    const leftGrad = ctx.createLinearGradient(0, 5, 0, H);
    leftGrad.addColorStop(0, accentColor); leftGrad.addColorStop(0.6, accentColor + '80'); leftGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = leftGrad; ctx.fillRect(0, 5, 6, H - 5);
    ctx.save(); ctx.globalAlpha = 0.15; ctx.font = '160px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(roleIcon, W - 180, H * 0.5 + 10); ctx.restore();
    ctx.save(); ctx.font = '600 14px Inter, system-ui, sans-serif'; ctx.textBaseline = 'middle';
    const bMeasure = ctx.measureText(roleLabel).width, bW = bMeasure + 28, bH = 28, bX = W - bW - 32, bY = 22;
    roundRectPath(ctx, bX, bY, bW, bH, 14); ctx.fillStyle = accentColor + '2a'; ctx.fill();
    roundRectPath(ctx, bX, bY, bW, bH, 14); ctx.strokeStyle = accentColor + '60'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = accentColor; ctx.textAlign = 'center'; ctx.fillText(roleLabel, bX + bW / 2, bY + bH / 2); ctx.restore();
    ctx.save(); ctx.font = '700 26px Poppins, sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    const doitW = ctx.measureText('Doit').width;
    ctx.fillStyle = '#ffffff'; ctx.fillText('Doit', 32, 50);
    ctx.fillStyle = '#2ECC71'; ctx.fillText('Delivery', 32 + doitW, 50); ctx.restore();
    const typeText = video.type === 'walkthrough' ? 'PLATFORM WALKTHROUGH' : 'FEATURE OVERVIEW';
    ctx.save(); ctx.font = '600 15px Inter, system-ui, sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = '#2ECC71'; ctx.fillText(typeText, 32, 342); ctx.restore();
    ctx.fillStyle = '#2ECC71'; ctx.fillRect(32, 352, 60, 2);
    const isWalkthrough = video.type === 'walkthrough';
    const titleFontStr = isWalkthrough ? '800 68px Poppins, sans-serif' : '700 58px Poppins, sans-serif';
    const lineH = isWalkthrough ? 82 : 70;
    ctx.save(); ctx.font = titleFontStr; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
    const titleLines = wrapText(ctx, video.title || '', W * 0.62);
    titleLines.forEach((line, i) => ctx.fillText(line, 32, 370 + lineH + i * lineH)); ctx.restore();
    const titleEndY = 370 + lineH + titleLines.length * lineH;
    ctx.save(); ctx.font = '400 20px Inter, system-ui, sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillText('⏱ ' + (video.duration_label || ''), 32, titleEndY + 28); ctx.restore();
    const bottomFade = ctx.createLinearGradient(0, H - 110, 0, H);
    bottomFade.addColorStop(0, 'transparent'); bottomFade.addColorStop(1, 'rgba(3,20,64,0.75)');
    ctx.fillStyle = bottomFade; ctx.fillRect(0, H - 110, W, 110);
    ctx.save(); ctx.font = '400 15px Inter, system-ui, sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillText('videos.doitdelivery.com', 32, H - 18); ctx.restore();
    if (video.status === 'published') {
      ctx.save(); ctx.font = '700 12px Inter, system-ui, sans-serif'; ctx.textBaseline = 'middle';
      const pubText = '✓ PUBLISHED', pubW = ctx.measureText(pubText).width + 22, pubH = 22, pubX = W - pubW - 32, pubY = H - 36;
      roundRectPath(ctx, pubX, pubY, pubW, pubH, 11); ctx.fillStyle = 'rgba(46,204,113,0.18)'; ctx.fill();
      ctx.fillStyle = '#2ECC71'; ctx.textAlign = 'center'; ctx.fillText(pubText, pubX + pubW / 2, pubY + pubH / 2); ctx.restore();
    }
  }

  async function drawAllThumbnails() {
    await document.fonts.ready;
    const videoMap = {};
    catalog.sections.forEach(sec => sec.videos.forEach(v => { videoMap[v.id] = v; }));
    document.querySelectorAll('canvas[data-vid]').forEach(canvas => {
      const video = videoMap[canvas.dataset.vid];
      if (video) drawThumbnail(canvas, video);
    });
  }
  const SECTION_ICONS = {
    'walkthroughs': '🎬', 'orders-dispatch': '📋', 'live-tracking': '📍',
    'route-builder': '🗺️', 'driver-app': '📱', 'scheduling-coverage': '📅',
    'notifications-alerts': '🔔', 'billing-finance': '💰', 'reports-audit': '📊',
    'client-user-mgmt': '👥'
  };

  let catalog = null;
  let apiData = {};     // video_id -> {transcript, team_notes, done}
  let currentFilter = 'all';

  const apiBadge = document.getElementById('api-badge');
  const doneCountEl = document.getElementById('done-count');
  const progressFill = document.getElementById('progress-fill');
  const catalogEl = document.getElementById('catalog');
  const sidebarEl = document.getElementById('sidebar').querySelector('.sidebar-section');

  // ── Load catalog JSON ──────────────────────────────────────────
  try {
    const res = await fetch(CATALOG_URL);
    catalog = await res.json();
  } catch (e) {
    catalogEl.innerHTML = '<div class="loading-msg">Could not load videos.json. Make sure the file is in the same directory.</div>';
    return;
  }

  // ── Load API data ──────────────────────────────────────────────
  try {
    const res = await fetch(API_BASE + '/video_catalog_items', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (res.status === 401) { showLogin(); return; }
    if (res.ok) {
      const json = await res.json();
      const items = json.data || json;
      items.forEach(item => { apiData[item.video_id || item.id] = item; });
      apiBadge.textContent = '● API Connected';
      apiBadge.className = 'topbar-badge';
    } else { throw new Error('non-ok'); }
  } catch {
    apiBadge.textContent = 'API Offline';
    apiBadge.className = 'topbar-badge error';
  }

  // ── Render ─────────────────────────────────────────────────────
  function renderCatalog() {
    catalogEl.innerHTML = '';
    let totalVideos = 0;

    catalog.sections.forEach(section => {
      const filtered = section.videos.filter(v => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'published') return v.status === 'published';
        return v.roles.includes(currentFilter) || v.roles.includes('all');
      });
      if (filtered.length === 0) return;
      totalVideos += filtered.length;

      const sec = document.createElement('div');
      sec.className = 'section';
      sec.id = 'sec-' + section.id;

      const titleBar = document.createElement('div');
      titleBar.className = 'section-title';
      titleBar.innerHTML = `<span>${SECTION_ICONS[section.id] || '▶'} ${section.title}</span><span class="section-count">${filtered.length} video${filtered.length !== 1 ? 's' : ''}</span>`;
      sec.appendChild(titleBar);

      const isWalkthrough = section.id === 'walkthroughs';
      const grid = document.createElement('div');
      grid.className = isWalkthrough ? 'walkthroughs-grid' : 'cards';
      sec.appendChild(grid);

      filtered.forEach(video => {
        const api = apiData[video.id] || {};
        const isDone = api.done || false;
        grid.appendChild(isWalkthrough ? buildWcard(video, api, isDone) : buildCard(video, api, isDone));
      });
      catalogEl.appendChild(sec);
    });

    document.getElementById('total-count').textContent = totalVideos;
    updateProgress();
    buildSidebar();
    wireHandlers();
    drawAllThumbnails();
  }

  function buildCard(video, api, isDone) {
    const div = document.createElement('div');
    div.className = 'card' + (isDone ? ' done' : '') + (video.status === 'published' ? ' published' : '');
    div.dataset.vid = video.id;
    div.dataset.roles = video.roles.join(' ');
    div.dataset.status = video.status;

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'card-thumb';
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'width:100%;display:block;';
    canvas.dataset.vid = video.id;
    thumbWrap.appendChild(canvas);
    div.appendChild(thumbWrap);

    const rolePills = video.roles.map(r => {
      if (r === 'all') return `<span class="pill pill-all">All</span>`;
      return `<span class="pill pill-${r}">${r === 'lab-client' ? 'Lab Client' : r === 'lab-company' ? 'Lab Co' : r.charAt(0).toUpperCase() + r.slice(1)}</span>`;
    }).join('');

    const row = document.createElement('div');
    row.innerHTML = `<div class="card-row">
      <div class="card-check"></div>
      <div class="card-body">
        <div class="card-title">${esc(video.title)}</div>
        <div class="card-meta">${rolePills}<span class="duration">${esc(video.duration_label)}</span></div>
      </div>
      <span class="type-pill type-feature">Feature</span>
    </div>`;
    div.appendChild(row.firstElementChild);
    return div;
  }

  function buildWcard(video, api, isDone) {
    const div = document.createElement('div');
    div.className = 'wcard' + (isDone ? ' done' : '') + (video.status === 'published' ? ' published' : '');
    div.dataset.vid = video.id;
    div.dataset.roles = video.roles.join(' ');
    div.dataset.status = video.status;

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'card-thumb';
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'width:100%;display:block;';
    canvas.dataset.vid = video.id;
    thumbWrap.appendChild(canvas);
    div.appendChild(thumbWrap);

    const statusBadge = video.status === 'published'
      ? `<span class="status-pill status-published">✓ Published</span>`
      : `<span class="status-pill status-planned">Planned</span>`;

    const row = document.createElement('div');
    row.innerHTML = `<div class="wcard-row">
      <div class="wcard-check"></div>
      <div class="wcard-body">
        <div class="wcard-title">${esc(video.title)}</div>
        <div class="wcard-desc">${esc(video.description)}</div>
        <div class="wcard-badges">${statusBadge}<span class="duration">${esc(video.duration_label)}</span></div>
      </div>
    </div>`;
    div.appendChild(row.firstElementChild);
    return div;
  }

  function buildSidebar() {
    sidebarEl.innerHTML = '<div class="sidebar-section-label">Sections</div>';
    catalog.sections.forEach(section => {
      if (!document.getElementById('sec-' + section.id)) return;

      const visibleVideos = section.videos.filter(v => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'published') return v.status === 'published';
        return v.roles.includes(currentFilter) || v.roles.includes('all');
      });
      if (visibleVideos.length === 0) return;

      const doneCount = visibleVideos.filter(v => (apiData[v.id] || {}).done).length;

      // Section header
      const header = document.createElement('div');
      header.className = 'sidebar-link';
      const titleSpan = document.createElement('span');
      titleSpan.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      titleSpan.textContent = section.title;
      header.appendChild(document.createElement('span')).className = 'sl-dot';
      header.appendChild(titleSpan);
      if (doneCount) {
        const done = document.createElement('span');
        done.className = 'sl-done';
        done.textContent = doneCount + '/' + visibleVideos.length;
        header.appendChild(done);
      }
      const arrow = document.createElement('span');
      arrow.className = 'sl-arrow open';
      arrow.textContent = '▶';
      header.appendChild(arrow);

      // Nested video links
      const vidsEl = document.createElement('div');
      vidsEl.className = 'sl-vids open';
      visibleVideos.forEach(v => {
        const isDone = (apiData[v.id] || {}).done;
        const a = document.createElement('a');
        a.className = 'sl-vid' + (isDone ? ' done' : '');
        a.href = 'video.html?id=' + encodeURIComponent(v.id);
        const dot = document.createElement('span');
        dot.className = 'sl-vid-dot';
        const label = document.createElement('span');
        label.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        label.textContent = v.title;
        a.appendChild(dot);
        a.appendChild(label);
        a.addEventListener('click', e => e.stopPropagation());
        vidsEl.appendChild(a);
      });

      // Toggle expand/collapse on header click; scroll to section on title click
      header.addEventListener('click', () => {
        vidsEl.classList.toggle('open');
        arrow.classList.toggle('open');
      });
      titleSpan.addEventListener('click', e => {
        e.stopPropagation();
        vidsEl.classList.add('open');
        arrow.classList.add('open');
        document.getElementById('sec-' + section.id)?.scrollIntoView({ behavior: 'smooth' });
      });

      sidebarEl.appendChild(header);
      sidebarEl.appendChild(vidsEl);
    });
  }

  function updateProgress() {
    const cards = document.querySelectorAll('[data-vid]');
    const done = Array.from(cards).filter(c => c.classList.contains('done')).length;
    doneCountEl.textContent = done;
    progressFill.style.width = cards.length ? (done / cards.length * 100).toFixed(1) + '%' : '0%';
  }

  // ── Wire event handlers after render ───────────────────────────
  function wireHandlers() {
    document.querySelectorAll('[data-vid]').forEach(card => {
      const vid = card.dataset.vid;
      const check = card.querySelector('.card-check, .wcard-check');

      // Whole card navigates to detail page
      card.addEventListener('click', () => {
        window.location.href = 'video.html?id=' + encodeURIComponent(vid);
      });

      // Done checkbox toggles without navigating
      if (check) {
        check.addEventListener('click', e => {
          e.stopPropagation();
          const isDone = !card.classList.contains('done');
          card.classList.toggle('done', isDone);
          updateProgress();
          buildSidebar();
          patchApi(vid, { done: isDone });
        });
      }
    });
  }

  // ── API calls ──────────────────────────────────────────────────
  async function patchApi(vid, patch) {
    if (!getToken()) { showLogin(); return; }
    const existing = apiData[vid] || {};
    const merged = { transcript: existing.transcript, team_notes: existing.team_notes, done: existing.done, ...patch };
    try {
      const res = await fetch(API_BASE + '/video_catalog_items/' + vid, {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({ data: merged }),
      });
      if (res.status === 401) { token = null; try { localStorage.removeItem('doit_video_token'); } catch {} showLogin(); return; }
      if (res.ok) { const j = await res.json(); apiData[vid] = j.data || j; }
    } catch {}
  }

  // ── Filters ───────────────────────────────────────────────────
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderCatalog();
    });
  });

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  renderCatalog();
  } // end initApp
})();
</script>
</body>
</html>
